{% extends "base.html" %}

{% block title %}Dashboard - ToDo App{% endblock %}

{% block content %}
<div class="ui centered grid">
    <div class="row">
        <div class="column">
            <div class="ui raised padded segment">
                <h3 class="ui header">Dashboard</h3>
                <div class="ui three small statistics">
                    <div class="statistic">
                        <div class="value">{{ total }}</div>
                        <div class="label">Total</div>
                    </div>
                    <div class="green statistic">
                        <div class="value">{{ done }}</div>
                        <div class="label">Completed</div>
                    </div>
                    <div class="orange statistic">
                        <div class="value">{{ total - done }}</div>
                        <div class="label">Pending</div>
                    </div>
                </div>
                {% if total %}
                <div class="ui divider"></div>
                <div class="ui green progress" data-percent="{{ percent }}">
                    <div class="bar" style="width: {{ percent }}%"></div>
                    <div class="label">{{ percent }}% completed</div>
                </div>
                {% endif %}
                <a class="ui basic button" href="{{ url_for('index') }}"><i class="arrow left icon"></i> Back to list</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
