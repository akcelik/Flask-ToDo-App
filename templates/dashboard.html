{% extends "base.html" %}

{% block title %}Dashboard - ToDo App{% endblock %}

{% block content %}
<h1 class="page-title">Dashboard</h1>
<p class="page-subtitle">An overview of your tasks.</p>

<div class="stats">
    <div class="card stat">
        <div class="stat-label">Total</div>
        <div class="stat-value">{{ total }}</div>
    </div>
    <div class="card stat done">
        <div class="stat-label">Completed</div>
        <div class="stat-value">{{ done }}</div>
    </div>
    <div class="card stat pending">
        <div class="stat-label">Pending</div>
        <div class="stat-value">{{ total - done }}</div>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="progress-head">
            <span>Progress</span>
            <span>{{ percent }}% completed</span>
        </div>
        <div class="progress" role="progressbar" aria-valuenow="{{ percent }}" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar" style="width: {{ percent }}%"></div>
        </div>
    </div>
</div>

<div class="actions">
    <a class="btn btn-ghost" href="{{ url_for('index') }}">{{ icon('arrow-left') }} Back to list</a>
</div>
{% endblock %}
